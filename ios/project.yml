name: Couchcast
options:
  bundleIdPrefix: com.mundymorning
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  CouchcastCore:
    path: CouchcastCore
  GoogleCast:
    url: https://github.com/SRGSSR/google-cast-sdk
    exactVersion: 4.8.6
targets:
  Couchcast:
    type: application
    platform: iOS
    sources: [Couchcast]
    dependencies:
      - package: CouchcastCore
      - package: GoogleCast
    info:
      path: Couchcast/Info.plist
      properties:
        CFBundleDisplayName: Couchcast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Couchcast talks to your Roku and shares the videos and photos you choose with it over your home Wi-Fi.
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mundymorning.couchcast
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
schemes:
  Couchcast:
    build:
      targets:
        Couchcast: all
